name: Security check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 03:00 UTC
  workflow_dispatch:

jobs:
  bandit:
    name: == 1. Bandit (SAST) ==
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - run: pip install bandit 

      - run: bandit -r app -lll


  pip-audit:
    name: == 2. pip-audit (dépendances) ==
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - run: pip install pip-audit 

      - run: pip-audit -r app/requirements.txt --strict


  gitleaks:
    name: == 3. gitleaks (secrets) ==
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet
      - uses: gitleaks/gitleaks-action@v2

      - run: gitleaks detect --source . --no-banner || echo "gitleaks non installé ou fuite détectée"


  pytest:
    name: == 4. Tests de conformité ==
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - run: pip install pytest 
      - run: pip install -r app/requirements.txt 

      - run: pytest -q tests


  trivy:
    name: == 5. Trivy (vulnérabilités, secrets, IaC) ==
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
      
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
